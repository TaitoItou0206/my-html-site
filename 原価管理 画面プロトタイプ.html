  const alloc = (w, rates) => Object.entries(rates).forEach(([n, r]) => ins('BasicBudgetAllocation', { CostPlanWorkId: w.Id, CostDisciplineId: cd[n], AllocRate: r, AllocAmount: Math.round(w.BasicBudget * r), ChargeGroupId: n === '意匠' ? g['設計二第一Ｇ'] : n === '構造' ? g['構造第三Ｇ'] : g['設備第三Ｇ'], ChargeGLEmployeeId: e['田中GL'] }));
  alloc(wB, { 意匠: .5, 構造: .1, 機械: .3, 電気: .1 }); alloc(wJ, { 意匠: .7, 構造: .1, 機械: .1, 電気: .1 }); alloc(wK, { 意匠: .7, 構造: .1, 機械: .1, 電気: .1 });
  const aBI = d.BasicBudgetAllocation[0];
  const items = { 人件費: 2785000, 派遣外注費: 950000, その他の外注費: 0, 契約オプション業務: 124500, その他費用: 83000, 確認申請など手数料: 207500, '出張旅費（国内）': 0 };
  Object.entries(items).forEach(([n, a]) => ins('BasicBudgetItem', { BasicBudgetAllocationId: aBI.Id, PaymentItemId: pi[n], Amount: a, InitialSource: n === '人件費' ? '自動（残り）' : n === '契約オプション業務' ? '算定書の内訳' : '手入力' }));
  // 実行予算（基本設計・意匠） 版0 作成中
  const eb = ins('ExecutionBudget', { BasicBudgetAllocationId: aBI.Id, VersionNo: 0, IsLatest: true, WFStatus: '作成中', EditableByManager: false });

  mem('GL', e['山田一郎'], '参事', 5, [3, 3, 3, 3, 3.56]); mem('設計責任者', e['佐藤次郎'], '副参事', 40, [20, 20, 20, 20, 20]); mem('設計担当者', e['小林三郎'], '総合職2級', 55, [30, 30, 30, 30, 40]);

const ins = (t, o) => { db._ids[t] = (db._ids[t] || 0) + 1; const r = { Id: db._ids[t], ...o }; db[t].push(r); return r; };
const get = (t, id) => db[t].find(r => r.Id === id);
const where = (t, f) => db[t].filter(f);
const del = (t, f) => { db[t] = db[t].filter(r => !f(r)); };
db = load();

// ---------- 計算 ----------
const en = v => (v == null || v === '') ? '' : Math.round(v).toLocaleString('ja-JP');
const yen = v => { if (v == null || v === '') return ''; const k = Math.sign(v) * Math.ceil(Math.round(Math.abs(v)) / 1000); return (k === 0 ? 0 : k).toLocaleString('ja-JP'); };
const num = v => +v || 0;
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const months = (f, t) => { const r = []; let [y, m] = f.split('-').map(Number); const [ty, tm] = t.split('-').map(Number); while (y < ty || (y === ty && m <= tm)) { r.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } } return r; };
const mlabel = s => +s.split('-')[1] + '月';
const nm = (t, id) => (get(t, id) || {}).Name || '';
const me = () => +document.getElementById('who').value;
const WHO = [['佐藤次郎','設計責任者'],['田中GL','担当GL・主幹GL（上長）'],['設計部長','所属設計部長'],['建築設計管理部長','建築設計管理部長'],['中井一郎','建築設計管理部（依頼書登録）']];
const empId = n => db.Employee.find(e => e.Name === n).Id;
const isRole = n => me() === empId(n);
const reqC = w => sum(where('DesignRequest', r => r.CostPlanWorkId === w.Id && !r.IsProspect).map(r => r.RequestAmount));
const reqSpan = w => { const rs = where('DesignRequest', r => r.CostPlanWorkId === w.Id && !r.IsProspect); return rs.length ? `${rs.map(r => r.PeriodFrom).sort()[0]}～${rs.map(r => r.PeriodTo).sort().pop()}` : ''; };
const allocs = w => where('BasicBudgetAllocation', a => a.CostPlanWorkId === w.Id).sort((a, b) => get('CostDiscipline', a.CostDisciplineId).SortOrder - get('CostDiscipline', b.CostDisciplineId).SortOrder);
const items = a => db.PaymentItem.map(p => where('BasicBudgetItem', i => i.BasicBudgetAllocationId === a.Id && i.PaymentItemId === p.Id)[0] || { PaymentItemId: p.Id, Amount: 0, _new: true });
const laborBase = a => a.AllocAmount - sum(where('BasicBudgetItem', i => i.BasicBudgetAllocationId === a.Id && !get('PaymentItem', i.PaymentItemId).IsLabor).map(i => i.Amount));
const latestEB = a => where('ExecutionBudget', e => e.BasicBudgetAllocationId === a.Id && e.IsLatest)[0];
const memMonthly = m => where('ExecBudgetMemberMonthly', x => x.ExecBudgetMemberId === m.Id);
const memAmt = m => sum(memMonthly(m).map(x => num(x.PlannedHours) * m.HourlyRate));
const lineMonthly = l => where('ExecBudgetCostLineMonthly', x => x.ExecBudgetCostLineId === l.Id);
const lineMonthAmt = (l, x) => l.HourlyRate ? num(x.PlannedHours) * l.HourlyRate : num(x.PlannedAmount);
const lineAmt = l => sum(lineMonthly(l).map(x => lineMonthAmt(l, x)));
const ebLabor = eb => sum(where('ExecBudgetMember', m => m.ExecutionBudgetId === eb.Id).map(memAmt));
const ebByItem = (eb, pid) => get('PaymentItem', pid).IsLabor ? ebLabor(eb) : sum(where('ExecBudgetCostLine', l => l.ExecutionBudgetId === eb.Id && l.PaymentItemId === pid).map(lineAmt));
const ebTotal = eb => eb ? ebLabor(eb) + sum(where('ExecBudgetCostLine', l => l.ExecutionBudgetId === eb.Id).map(lineAmt)) : 0;
const workF = w => sum(allocs(w).map(a => ebTotal(latestEB(a))));
const rateOf = qid => (db.QualificationHourlyRate.find(r => r.QualificationId === qid) || {}).Rate || 0;
const qualAt = (eid, ym) => (db.EmployeeQualification.find(x => x.EmployeeId === eid && x.From <= ym && (!x.To || x.To >= ym)) || {}).QualificationId;
const route = (eb, a) => ebTotal(eb) > a.AllocAmount ? '赤字' : '予算内';
const editable = eb => { const w = get('CostPlanWork', get('BasicBudgetAllocation', eb.BasicBudgetAllocationId).CostPlanWorkId); return w.Status !== '完了' && (eb.WFStatus === '作成中' || eb.WFStatus === '差戻') && eb.IsLatest; };
const ts = (n = 16) => { const d = new Date(); const p = x => String(x).padStart(2, '0'); return (d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())).slice(0, n); };
function ask(msg, yes) {

  const rows = db[sel]; const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  box.innerHTML = `<div class="row"><b>テーブル</b><select id="dt">${ts.map(t => `<option ${t === sel ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="note">${rows.length}行。画面の操作でこのデータが変わります（列名はテーブル定義たたき台V2と同じ。_で始まる列は画面用の補助）</span></div>
  <div class="wrap" style="max-height:340px;overflow:auto;margin-top:6px"><table><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>${rows.map(r => `<tr>${cols.map(c => `<td>${r[c] == null ? '' : String(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  document.getElementById('dt').onchange = e => { box.dataset.t = e.target.value; vData(); };
}

// ---------- 起動 ----------
const whoSel = document.getElementById('who');
whoSel.innerHTML = WHO.map(([n, r]) => `<option value="${empId(n)}">${n}（${r}）</option>`).join('');
whoSel.onchange = render;
document.getElementById('btnData').onclick = () => { document.getElementById('data').classList.toggle('on'); render(); };
document.getElementById('btnReset').onclick = () => ask('入力した内容を消して、初期データに戻します。よろしいですか？', () => { try { localStorage.removeItem(KEY); } catch (e) {} db = seed(); ui = { screen: 'list' }; render(); });
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') e.target.style.display = 'none'; };
render();
</script>
